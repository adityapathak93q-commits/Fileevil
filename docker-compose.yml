version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:3000}
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-8}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-180}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-240}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SIGNALING_URL: ${NEXT_PUBLIC_SIGNALING_URL:-http://localhost:4000}
    depends_on:
      - server
    restart: unless-stopped

  # Optional: self-hosted TURN server for reliable cross-network connectivity
  # behind restrictive NATs/firewalls. Uncomment and configure to run your
  # own instead of a third-party TURN provider. See README for details.
  #
  # coturn:
  #   image: coturn/coturn:latest
  #   network_mode: host
  #   command: >
  #     -n --realm=filesync.local
  #     --listening-port=3478
  #     --min-port=49160 --max-port=49200
  #     --user=filesync:CHANGE_ME
  #     --no-cli --no-tls --no-dtls
  #   restart: unless-stopped
